<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<title>NEXORA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --line:#E2E8F0;
  --ink:#0F172A; --muted:#64748B;
  --accent:#0284C7; --accent-ink:#FFFFFF; --accent-soft:rgba(2,132,199,.10);
  --sky:#0284C7; --digit:#0F172A;
  --clock1:#FFFFFF; --clock2:#F1F5F9; --halo1:rgba(2,132,199,.07); --halo2:rgba(139,92,246,.05); --glow:none;
  --amber:#B45309; --amber-soft:#FEF3C7; --rose:#BE123C; --rose-soft:#FFE4E6; --ok:#047857; --ok-soft:#D1FAE5;
  --shadow:0 6px 24px rgba(15,23,42,.06);
  --radius:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#111827; --surface-2:#172033; --line:rgba(148,163,184,.18);
    --ink:#F8FAFC; --muted:#94A3B8;
    --accent:#8B5CF6; --accent-ink:#FFFFFF; --accent-soft:rgba(139,92,246,.16);
    --sky:#38BDF8; --digit:#F8FAFC;
    --clock1:#131C30; --clock2:#111827; --halo1:rgba(56,189,248,.10); --halo2:rgba(139,92,246,.10); --glow:0 0 28px rgba(56,189,248,.22);
    --amber:#FBBF24; --amber-soft:rgba(251,191,36,.14); --rose:#FB7185; --rose-soft:rgba(251,113,133,.14); --ok:#34D399; --ok-soft:rgba(52,211,153,.14);
    --shadow:0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#111827; --surface-2:#172033; --line:rgba(148,163,184,.18);
  --ink:#F8FAFC; --muted:#94A3B8;
  --accent:#8B5CF6; --accent-ink:#FFFFFF; --accent-soft:rgba(139,92,246,.16);
  --sky:#38BDF8; --digit:#F8FAFC;
  --clock1:#131C30; --clock2:#111827; --halo1:rgba(56,189,248,.10); --halo2:rgba(139,92,246,.10); --glow:0 0 28px rgba(56,189,248,.22);
  --amber:#FBBF24; --amber-soft:rgba(251,191,36,.14); --rose:#FB7185; --rose-soft:rgba(251,113,133,.14); --ok:#34D399; --ok-soft:rgba(52,211,153,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;
  line-height:1.65;font-size:16px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{top:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ========== الشريط الجانبي ========== */
.sidebar{
  position:fixed;inset-block:0;inset-inline-start:0;z-index:40;
  width:min(300px,86vw);background:var(--surface);border-inline-end:1px solid var(--line);
  display:flex;flex-direction:column;gap:10px;padding:14px 12px;
  transition:width .22s ease,transform .25s ease;
}
.sb-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:.06em;font-size:1.1rem;min-height:44px}
.brand svg{width:34px;height:34px;flex:none}
.sb-collapse{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);display:none;place-items:center;padding:0;flex:none}
.sb-collapse:hover{background:var(--surface-2);color:var(--ink)}
[dir="ltr"] .sb-collapse svg{transform:scaleX(-1)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.nav-item{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:10px 12px;
  border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:500;text-align:start;text-decoration:none;
  transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item[aria-current="page"],.nav-item.open{background:var(--accent-soft);color:var(--accent)}
.nav-item[aria-current="page"]::before{
  content:"";position:absolute;inset-inline-start:-12px;top:10px;bottom:10px;width:3px;border-radius:99px;background:var(--accent)
}
.nav-item::after{
  content:attr(data-label);position:absolute;inset-inline-start:calc(100% + 12px);top:50%;transform:translateY(-50%);
  background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:8px;font-size:.85rem;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .15s;z-index:60
}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(5,10,24,.55)}
.scrim[hidden]{display:none}

/* ===== الجوال والتابلت: قائمة جانبية منزلقة ===== */
@media (max-width:899px){
  .sidebar{transform:translateX(calc(var(--d) * 100%));visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
  [dir="rtl"]{--d:1}
  [dir="ltr"]{--d:-1}
  body.sb-open .sidebar{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
  .nav-item::after{display:none}
}
.main-wrap{min-height:100vh}
.topbar{display:none}
@media (max-width:899px){
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line)}
  .tb-title{font-weight:700;font-size:1.05rem}
  .tb-brand{margin-inline-start:auto;font-weight:700;letter-spacing:.08em;color:var(--muted);font-size:.9rem}
}
.menu-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
@media (min-width:900px){
  .sidebar{width:264px}
  .sb-collapse{display:grid}
  .main-wrap{margin-inline-start:264px;transition:margin .22s ease}
  body.sb-collapsed .sidebar{width:76px;padding-inline:10px}
  body.sb-collapsed .main-wrap{margin-inline-start:76px}
  body.sb-collapsed .sb-head{flex-direction:column;gap:8px}
  body.sb-collapsed .brand .brand-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  body.sb-collapsed .nav-item{justify-content:center;padding-inline:0}
  body.sb-collapsed .nav-item .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  body.sb-collapsed .nav-item[aria-current="page"]::before{inset-inline-start:-10px}
  body.sb-collapsed .nav-item:hover::after,body.sb-collapsed .nav-item:focus-visible::after{opacity:1}
  body.sb-collapsed .sb-collapse svg{transform:scaleX(-1)}
  [dir="ltr"] body.sb-collapsed .sb-collapse svg{transform:none}
}

/* ========== المحتوى ========== */
.content{max-width:1000px;margin:0 auto;padding:20px 16px 72px}
#main:focus{outline:none}
.view[hidden]{display:none}
.stack{display:grid;gap:16px}
.grid{display:grid;gap:16px}
@media(min-width:900px){.grid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h2{margin:0;font-size:1.2rem;font-weight:700}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
h1.page{margin:0 0 4px;font-size:1.5rem}

/* ========== بطاقة الساعة ========== */
.clockcard{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:26px;padding:26px 24px 22px;box-shadow:var(--shadow);
  background:
    radial-gradient(60% 80% at 92% 0%, var(--halo1), transparent 60%),
    radial-gradient(50% 70% at 4% 100%, var(--halo2), transparent 60%),
    linear-gradient(160deg,var(--clock1),var(--clock2));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
@media(min-width:720px){.clockcard{padding:32px 34px 26px}}
.greet{margin:0;color:var(--muted);font-size:1rem;font-weight:500}
.clockwrap{display:flex;margin-top:10px}
.clock{direction:ltr;display:flex;align-items:flex-end;gap:12px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";line-height:1}
.clock .hm{display:flex;align-items:baseline;font-size:clamp(4rem,19vw,7.6rem);font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--digit);text-shadow:var(--glow)}
.clock .d{display:inline-block;min-width:2ch;text-align:center}
.clock #hh{text-align:end}
.clock .colon{color:var(--sky);opacity:.65;margin:0 .02em;font-weight:500}
.clock .side{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-bottom:.55rem}
.clock .sec{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:500;color:var(--sky);min-width:2ch}
.clock .ap{font-size:.9rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.clock .ap:empty{display:none}
.swap{animation:swapIn .28s ease-out}
@keyframes swapIn{from{opacity:.3;transform:translateY(-6px)}to{opacity:1;transform:none}}
.cc-info{margin-top:20px;display:grid;gap:2px}
.cc-info .wk{color:var(--muted);font-size:.95rem}
.cc-info .gr{font-size:1.3rem;font-weight:600}
.cc-info .hij{color:var(--muted);font-size:.95rem}
.cc-prog{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.day-label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.day-label b{color:var(--ink);font-weight:600}
.day-track{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.day-fill{height:100%;background:var(--sky);border-radius:99px;width:0;transition:width .6s}
.ticks{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:6px}

/* بطاقات النظرة السريعة */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.tile b{display:block;font-size:2rem;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.9rem}

/* ========== عناصر مشتركة ========== */
.field,.select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.field::placeholder{color:var(--muted)}
textarea.field{resize:vertical;min-height:110px;line-height:1.7}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.add{display:flex;gap:8px;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;min-height:36px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0;flex:none}
.nav-btn:hover{background:var(--accent-soft)}
[dir="rtl"] .chev{transform:scaleX(-1)}
.daybar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.daybar .dlabel{flex:1;min-width:10rem;font-weight:600;text-align:center}
.icon-btn{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:8px;font-size:1.1rem;flex:none}
.icon-btn:hover{background:var(--rose-soft);color:var(--rose)}
.chip{border:0;border-radius:99px;padding:3px 10px;font-size:.8rem;font-weight:600;min-height:28px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.p1,.chip.s1{background:var(--amber-soft);color:var(--amber)}
.chip.p2{background:var(--rose-soft);color:var(--rose)}
.chip.s0{border:1px solid var(--line)}
.chip.s2{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;border:1px dashed var(--line);border-radius:10px;font-size:.95rem}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:6px;min-height:36px}
.link:hover{color:var(--ink)}
.link.danger{color:var(--rose)}

/* التقويم */
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav .title{font-weight:700;font-size:1.1rem;min-width:9rem;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;color:var(--muted);font-size:.8rem;font-weight:600;padding:4px 0}
.cell{min-height:50px;border:1px solid transparent;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px 0;font-variant-numeric:tabular-nums;font-weight:500}
.cell:hover{background:var(--surface-2)}
.cell.today{border-color:var(--accent);color:var(--accent);font-weight:700}
.cell.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cell.blank{visibility:hidden;pointer-events:none}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.ok{background:var(--ok)}
.dots i.n{background:var(--amber)}
.cell.sel .dots i{background:var(--accent-ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:10px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;background:var(--accent)}
.legend .l2::before{background:var(--amber)}
.legend .l3::before{background:var(--ok)}
.daysum{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.daysum .actions{display:flex;gap:8px;flex-wrap:wrap}

/* المهام */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:.9rem;color:var(--muted)}
.prog-track{flex:1;height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);width:0;transition:width .35s}
.task{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.task.done .t-text{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);flex:none;display:grid;place-items:center;padding:0;color:transparent}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.t-text{flex:1;min-width:0;overflow-wrap:anywhere}

/* الملاحظات */
.editor{display:grid;gap:8px;margin-bottom:14px}
.editor-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.editor-actions .msg{color:var(--ok);font-size:.88rem}
.editor .where{color:var(--muted);font-size:.85rem}
.ncard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.ncard.editing{border-color:var(--accent);background:var(--accent-soft)}
.nhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ntitle{font-weight:700;overflow-wrap:anywhere}
.nbody{margin:6px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.nfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.85rem}

/* القاعدة الرئيسية */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .field{width:auto;min-width:150px;flex:1}
.base-add{display:grid;gap:8px;grid-template-columns:1fr;margin:12px 0 16px}
@media(min-width:720px){.base-add{grid-template-columns:2fr 1.2fr 1fr auto}}
.rows{display:grid;gap:6px}
.row{display:grid;gap:8px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);grid-template-columns:1fr auto}
.row .r-name{font-weight:600;grid-column:1/-1;overflow-wrap:anywhere}
.row .r-meta{color:var(--muted);font-size:.88rem}
@media(min-width:720px){.row{grid-template-columns:2fr 1.2fr 1fr 1fr auto}.row .r-name{grid-column:auto}}
.rows-head{display:none}
@media(min-width:720px){.rows-head{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:12px;padding:0 12px 4px;color:var(--muted);font-size:.85rem;font-weight:600}.rows-head span:last-child{width:36px}}
.board{display:grid;gap:12px}
@media(min-width:720px){.board{grid-template-columns:repeat(3,1fr)}}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.col h3{margin:2px 4px 10px;font-size:.95rem;display:flex;justify-content:space-between}
.col h3 span{color:var(--muted);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;gap:6px}
.kcard b{overflow-wrap:anywhere}
.kcard .r-meta{color:var(--muted);font-size:.85rem}
.kfoot{display:flex;justify-content:space-between;align-items:center;gap:6px}

/* الإعدادات */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(5,10,24,.6);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.overlay .sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:20px 20px 0 0;border:1px solid var(--line)}
@media(min-width:601px){.overlay{align-items:center}.overlay .sheet{border-radius:20px}}
.sheet{padding:18px 18px 24px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet h3{margin:20px 0 4px;font-size:.95rem;color:var(--muted);font-weight:600}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.srow b{font-weight:600}
.srow .sub{margin:0}
.sw{width:50px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:inset-inline-start .15s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{inset-inline-start:24px;background:var(--accent-ink)}
.abtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 14px;min-height:40px;font-weight:600}
.abtn:hover{background:var(--accent-soft)}
.abtn.danger{color:var(--rose);border-color:var(--rose)}
.abtn.danger:hover{background:var(--rose-soft)}
.setmsg{min-height:1.4em;color:var(--ok);font-size:.88rem;margin:10px 0 0}
.about{color:var(--muted);font-size:.82rem;margin:14px 0 0}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

          <input class="field" id="taskInput" data-i-ph="taskPh" autocomplete="off">

        </div>
        <ul class="list" id="taskList"></ul>
      </div>
    </section>

    <!-- التقويم -->

  };
  let lang = 'ar';
  const t = (k,p) => { let s = (I[lang] && I[lang][k] != null) ? I[lang][k] : (I.ar[k] != null ? I.ar[k] : k); if(p) for(const x in p) s = s.replace('{'+x+'}', p[x]); return s; };

  let state = {tasks:[], notes:[], base:[]};

  { const d = new Date(); ui.calY = d.getFullYear(); ui.calM = d.getMonth(); }
  let saveTimer;

  async function load(){
    let raw = await store.get(KEY);

    }

  /* ================= التنسيقات حسب اللغة ================= */
  let F = {};
  function mkFormats(){
    const L = lang==='ar' ? 'ar-EG-u-nu-latn' : 'en-US';

  /* ================= اللغة والمظهر والشريط ================= */

  /* ================= التنقل (الشريط الجانبي) ================= */
  const PAGES = ['home','tasks','calendar','notes','base'];
  function openDrawer(){

  /* ================= الساعة والتاريخ ================= */
  let lastDay = -1;
  function setDigit(el, val){
    if(el.textContent === val) return;

    el.textContent = val;
    if(had){ el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); }
  }
  function tick(){
    const d = new Date(), h = d.getHours(), m = d.getMinutes(), sc = d.getSeconds();
    const h24 = settings.clockFmt==='24';
    setDigit($('#hh'), h24 ? pad(h) : String(h%12||12));
    setDigit($('#mm'), pad(m));
    $('#sec').textContent = pad(sc);
    $('#sec').hidden = !settings.showSec;
    $('#ap').textContent = h24 ? '' : t(h<12 ? 'ap_am' : 'ap_pm');
    const secs = h*3600+m*60+sc;
    $('#dayFill').style.width = (secs/864)+'%';
    $('#dayPct').textContent = Math.round(secs/864)+'%';
    const rem = 86400-secs;
    $('#left').textContent = t('remain',{h:Math.floor(rem/3600), m:pad(Math.floor(rem%3600/60))});
    $('#hij').hidden = !settings.showHijri || !F.hij;
    if(lastDay !== d.getDate()){
      lastDay = d.getDate();
      $('#greet').textContent = t(h<5 ? 'g_night' : h<12 ? 'g_morning' : h<17 ? 'g_noon' : h<21 ? 'g_eve' : 'g_late');
      $('#wk').textContent = F.wk.format(d);

  /* ================= الرئيسية (نظرة سريعة) ================= */
  function renderHome(){
    const tk = todayKey();

    const notes = state.notes.filter(x=>x.date===tk).length;
    const tiles = [
      ['#/tasks', open, 'overview_tasks'], ['#/tasks', done, 'overview_done'],
      ['#/notes', notes, 'overview_notes'], ['#/base', state.base.length, 'overview_base']
    ];
    $('#tiles').innerHTML = tiles.map(x=>'<a class="tile" href="'+x[0]+'"><b>'+x[1]+'</b><span>'+t(x[2])+'</span></a>').join('');
  }

  /* ================= شريط اليوم والتقويم ================= */
  const CH_PREV = '<svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  const CH_NEXT = '<svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  function renderDayBars(){
    const html = '<button class="nav-btn" data-daynav="-1" aria-label="'+t('prevDay')+'">'+CH_PREV+'</button>'+
      '<div class="dlabel">'+esc(selLabel())+'</div>'+
      '<button class="nav-btn" data-daynav="1" aria-label="'+t('nextDay')+'">'+CH_NEXT+'</button>'+
      '<button class="btn ghost" data-daynav="0">'+t('today')+'</button>';

  function setSel(k){

    const d = dparse(ui.sel); d.setDate(d.getDate()+v); setSel(dkey(d));

  function dayInfo(){
    const m = {};
    state.tasks.forEach(x=>{ const o = m[x.date] || (m[x.date]={open:0,done:0,notes:0}); x.done ? o.done++ : o.open++; });
    state.notes.forEach(n=>{ const o = m[n.date] || (m[n.date]={open:0,done:0,notes:0}); o.notes++; });
    return m;
  }
  function renderCal(){
    const y = ui.calY, mo = ui.calM, info = dayInfo(), tk = todayKey();
    $('#calTitle').textContent = F.month.format(new Date(y,mo,1));
    const ws = Number(settings.weekStart)||0;

  $('#goToday').onclick = ()=> setSel(todayKey());

  /* ================= المهام ================= */

  /* ================= الملاحظات ================= */
  let msgTimer;
  function flash(msg){

  function clearEditor(){ $('#noteTitle').value=''; $('#noteText').value=''; ui.editing=null; }

      if(!armed.get(n.id)){
        armed.set(n.id,true); btn.textContent = t('confirmDel');
        setTimeout(()=>{ armed.delete(n.id); if(btn.isConnected) btn.textContent = t('del'); }, 3000);
        return;
      }
      state.notes = state.notes.filter(x=>x!==n);
      if(ui.editing===n.id) clearEditor();
      renderNotes(); renderCal(); renderHome(); save();
    }
  });

  /* ================= القاعدة الرئيسية ================= */
  const fD = v => v ? F.sdate.format(dparse(v)) : '—';
  function renderBase(){
    const q = ui.q.trim().toLowerCase();
    const items = state.base.filter(b =>
      (ui.st==='all' || String(b.status)===ui.st) &&
      (!q || b.name.toLowerCase().includes(q) || (b.cat||'').toLowerCase().includes(q)));
    $('#baseSub').textContent = state.base.length ? t('itemsN',{n:state.base.length}) : '';
    $('#cats').innerHTML = [...new Set(state.base.map(b=>b.cat).filter(Boolean))].map(c=>'<option value="'+esc(c)+'">').join('');
    const S = [t('st0'),t('st1'),t('st2')];
    if(!items.length){
      $('#baseView').innerHTML = '<div class="empty">'+t(state.base.length ? 'noMatch' : 'baseEmpty')+'</div>';
      return;
    }
    if(ui.view==='table'){
      $('#baseView').innerHTML =
        '<div class="rows-head"><span>'+t('hName')+'</span><span>'+t('hCat')+'</span><span>'+t('hDate')+'</span><span>'+t('hStatus')+'</span><span></span></div>'+
        '<div class="rows">'+items.map(b=>`
          <div class="row" data-id="${b.id}">
            <span class="r-name">${esc(b.name)}</span>
            <span class="r-meta">${esc(b.cat||t('noCat'))}</span>
            <span class="r-meta">${fD(b.date)}</span>
            <button class="chip s${b.status}" data-a="status" title="${t('statusTitle')}">${S[b.status]}</button>
            <button class="icon-btn" data-a="bdel" aria-label="${t('delItem')}">✕</button>
          </div>`).join('')+'</div>';
    }else{
      $('#baseView').innerHTML = '<div class="board">'+S.map((s,i)=>{
        const col = items.filter(b=>b.status===i);
        return '<div class="col"><h3>'+s+'<span>'+col.length+'</span></h3>'+
          (col.map(b=>`
            <div class="kcard" data-id="${b.id}">
              <b>${esc(b.name)}</b>
              <span class="r-meta">${esc(b.cat||t('noCat'))} • ${fD(b.date)}</span>
              <div class="kfoot">
                <button class="chip s${b.status}" data-a="status">${t(i<2?'moveNext':'restart')}</button>
                <button class="icon-btn" data-a="bdel" aria-label="${t('delItem')}">✕</button>
              </div>
            </div>`).join('') || '<div class="r-meta" style="padding:6px 4px">'+t('emptyCol')+'</div>')+'</div>';
      }).join('')+'</div>';
    }
  }
  function addBase(){
    const n = $('#bName'), name = n.value.trim();
    if(!name){ n.focus(); return; }
    state.base.push({id:uid(), name, cat:$('#bCat').value.trim(), status:0, date:$('#bDate').value});
    n.value=''; $('#bCat').value=''; $('#bDate').value=''; n.focus();
    renderBase(); renderHome(); save();
  }
  $('#bAdd').onclick = addBase;
  $('#bName').addEventListener('keydown', e=>{ if(e.key==='Enter') addBase(); });
  $('#search').addEventListener('input', e=>{ ui.q = e.target.value; renderBase(); });
  $('#statusFilter').addEventListener('change', e=>{ ui.st = e.target.value; renderBase(); });
  $('#viewSwitch').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    ui.view = b.dataset.v;
    $$('#viewSwitch button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    renderBase();
  });
  $('#baseView').addEventListener('click', e=>{
    const btn = e.target.closest('[data-a]'); if(!btn) return;
    const el = btn.closest('[data-id]'); const b = state.base.find(x=>x.id===el.dataset.id); if(!b) return;
    if(btn.dataset.a==='status') b.status = (b.status+1)%3;
    if(btn.dataset.a==='bdel') state.base = state.base.filter(x=>x!==b);
    renderBase(); renderHome(); save();
  });

  /* ================= نسخ احتياطي ومسح ================= */
  $('#export').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'nexora-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  };
  $('#importBtn').onclick = ()=> $('#importFile').click();
  $('#importFile').addEventListener('change', async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{
      const s = JSON.parse(await f.text());
      if(!s || !Array.isArray(s.tasks)) throw new Error('bad');
      const tk = todayKey();
      state = {
        tasks: s.tasks.map(x=>Object.assign({date:tk}, x)),
        notes: Array.isArray(s.notes) ? s.notes : [],
        base: Array.isArray(s.base) ? s.base : []
      };
      clearEditor(); renderAll(); save(); flash(t('restored'));
    }catch(err){ flash(t('badFile')); }
    e.target.value = '';
  });
  let rArmed = false;
  $('#reset').onclick = function(){
    if(!rArmed){ rArmed = true; this.textContent = t('wipeConfirm'); setTimeout(()=>{ rArmed=false; this.textContent=t('wipe'); },4000); return; }
    state = {tasks:[],notes:[],base:[]}; clearEditor();
    rArmed=false; this.textContent=t('wipe'); renderAll(); save(); flash(t('wiped'));
  };

  function renderAll(){ renderDayBars(); renderCal(); renderTasks(); renderNotes(); renderBase(); renderHome(); }

  /* ================= بدء التشغيل ================= */
  (async function init(){
    mkFormats(); tick(); setInterval(tick, 1000);
    await load(); await loadSettings();
    applySettings();
  })();
})();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
